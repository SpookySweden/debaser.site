[package]
name = "debaser-engine"
version = "0.0.1"
edition = "2021"
description = "DEBASER_OS's own screen engine (SPEC-screens.md): grabs a screen, encodes it on the graphics card, and later sends it and takes input back."
publish = false

[dependencies]
# WebRTC that takes ready-encoded video (SPEC-screens.md). Its encryption comes from Windows itself ("wincrypto"),
# so nothing in C has to be built. Every crate this pulls in is listed with its licence in DEPENDENCIES.md.
str0m = { version = "0.25", default-features = false, features = ["wincrypto"] }
# SOUND: the Opus encoder. This crate is the reference Opus library itself, turned from C into Rust by a tool, so
# it builds with cargo alone (this PC has no cmake, which the crates that wrap the C library need).
unsafe-libopus = "0.2"
# CONTROLLER: talks to the ViGEmBus driver (already installed on the PC) to plug in a pretend Xbox 360 controller.
vigem-client = "0.1"

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
debug = false
