<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DEBASER SEEING MACHINE</title>
<meta name="referrer" content="no-referrer">
<link rel="stylesheet" href="machine.css">
<script type="module" src="machine.js"></script>
</head>
<body>
<h1 style="padding:4px 8px">THE SEEING MACHINE: OWN EYE</h1>
<form class="bar" id="go">
<button type="button" id="back" aria-label="Back" title="Back">◄</button>
<button type="button" id="forward" aria-label="Forward" title="Forward">►</button>
<button type="button" id="reload" aria-label="Reload" title="Reload">↻</button>
<input id="address" aria-label="Address" placeholder="ADDRESS" autocomplete="off" spellcheck="false" inputmode="url" maxlength="4000">
<button type="submit">[ GO ]</button>
</form>
<div class="bar"><span id="lenses" role="group" aria-label="Lens"></span>
<button id="media" aria-expanded="false">[ MEDIA ]</button><button id="watchers" aria-expanded="false">[ WATCHERS ]</button><button id="sites" aria-expanded="false">[ SITES ]</button>
<button id="tab">[ OPEN IN A TAB ↗ ]</button><button id="server">[ SERVER EYE ↗ ]</button></div>
<div id="stage"><div id="door" hidden></div><iframe id="page" title="Page" hidden referrerpolicy="no-referrer-when-downgrade" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-downloads"></iframe><div id="beside" hidden></div></div>
<p class="bar" role="status" id="status">READY</p>
</body>
</html>
