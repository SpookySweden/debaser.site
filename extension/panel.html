<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DEBASER SEEING MACHINE</title>
<link rel="stylesheet" href="panel.css">
<script type="module" src="panel.js"></script>
</head>
<body>
<main>
<h1>THE SEEING MACHINE</h1>
<p id="where"></p>
<div id="lenses" role="group" aria-label="Lens"></div>
<p role="status" id="status"></p>
<button id="add" hidden></button>
<button id="machine" title="Opens the page in front in the machine's own page, in a tab of its own: your own browser still, signed in as you, with the lenses, MEDIA, WATCHERS and your list of sites along its top.">[ SHOW IT IN THE MACHINE ↗ ]</button>
<button id="server" title="Opens the page in front in BROWSER on debaser.site through the SERVER EYE: fetched by the house, never signed in, rebuilt through the lenses. The site sees the house, not you. The site name and the time are written down there.">[ SERVER EYE: SIGNED OUT, ON DEBASER.SITE ↗ ]</button>
<h2>MEDIA</h2>
<div id="media"></div>
<h2>WATCHERS</h2>
<div id="watchers"></div>
</main>
</body>
</html>
